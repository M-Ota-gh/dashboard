<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moekaのダッシュボード</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1 class="title">Moekaのダッシュボード</h1>

    <section class="clock-panel" aria-label="現在時刻">
      <div id="clock" class="clock">--:--:--</div>
      <div id="date" class="date">----年--月--日（-）</div>
    </section>

    <section class="info">
      <div class="card-grid">
        <div class="card info-card">
          <span class="card-desc">金曜日まで</span>
          <span id="friday" class="info-value">あと -日</span>
        </div>

        <div class="card info-card card-wide">
          <label class="card-desc" for="subnet-input">サブネット電卓</label>
          <input id="subnet-input" class="subnet-input" type="text" value="192.168.10.0/24"
                 placeholder="192.168.10.0/24" inputmode="decimal" autocomplete="off" spellcheck="false">
          <p id="subnet-error" class="subnet-error" role="alert"></p>
          <dl id="subnet-result" class="subnet-result">
            <dt>ネットワークアドレス</dt><dd id="subnet-network">-</dd>
            <dt>ブロードキャストアドレス</dt><dd id="subnet-broadcast">-</dd>
            <dt>使える範囲</dt><dd id="subnet-range">-</dd>
            <dt>台数</dt><dd id="subnet-hosts">-</dd>
          </dl>
        </div>

        <div class="card info-card card-wide">
          <span class="card-desc">メモ</span>
          <span id="memo-title" class="card-name"></span>
          <p id="memo-status" class="memo-status">読み込み中…</p>
          <ul id="memo-list" class="memo-list"></ul>
        </div>
      </div>
    </section>

    <section class="links">
      <h2 class="section-title">よく使うリンク</h2>

      <!-- カードを増やすときは、下の <a class="card"> ... </a> をコピーして貼り付けてください -->
      <div class="card-grid">
        <a class="card" href="https://github.com/" target="_blank" rel="noopener noreferrer">
          <span class="card-name">GitHub</span>
          <span class="card-desc">コードの管理</span>
        </a>

        <a class="card" href="https://vercel.com/dashboard" target="_blank" rel="noopener noreferrer">
          <span class="card-name">Vercel</span>
          <span class="card-desc">デプロイ・ホスティング</span>
        </a>

        <a class="card" href="https://claude.ai/" target="_blank" rel="noopener noreferrer">
          <span class="card-name">Claude</span>
          <span class="card-desc">AI アシスタント</span>
        </a>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
